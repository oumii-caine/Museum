<script>

const bigEnvelope = document.getElementById("bigEnvelope");
const messageGallery = document.getElementById("messageGallery");

bigEnvelope.addEventListener("click", function () {

    console.log(window.innerWidth);

    bigEnvelope.classList.add("hidden");

    document.querySelector(".message-title").classList.add("hidden");

    setTimeout(function () {

        messageGallery.classList.add("show");

        const messages = document.querySelectorAll(".message");

        let positions;

        if (window.innerWidth <= 600) {

            positions = [
                [-120, -180, -8],
                [0, -190, 8],
                [120, -180, -5],

                [-130, -70, 7],
                [0, -80, -12],
                [130, -70, 10],

                [-130, 40, -8],
                [0, 30, 13],
                [130, 40, -10],

                [-130, 150, 6],
                [0, 160, -8],
                [130, 150, 12],

                [-120, 260, -10],
                [0, 270, 8],
                [120, 260, -6],

                [-120, 370, -12],
                [0, 380, 10],
                [120, 370, -8],

                [-80, 480, 8],
                [80, 480, -8],
                [0, 590, 0]
            ];

        } else if (window.innerWidth <= 900) {

            positions = [
                [-330, -280, -10],
                [-110, -300, 8],
                [110, -290, -5],
                [330, -270, 15],

                [-350, -100, 7],
                [-120, -120, -15],
                [120, -100, 10],
                [350, -90, -7],

                [-350, 100, -8],
                [-120, 90, 13],
                [120, 110, -12],
                [350, 120, 15],

                [-330, 290, 10],
                [-110, 280, -6],
                [110, 300, 11],
                [330, 290, -14],

                [-220, 450, 15],
                [0, 440, -6],
                [220, 450, 11],

                [-180, 0, -60],
                [180, 0, 60]
            ];

        } else {

            positions = [
                [-600, -300, -12],
                [-250, -300, 8],
                [30, -290, -5],
                [250, -300, 20],
                [460, -270, -5],

                [-500, -80, 7],
                [-280, -110, -15],
                [-40, -80, 10],
                [190, -120, -7],
                [430, -70, 16],

                [-420, 110, -8],
                [-190, 90, 13],
                [60, 110, -12],
                [300, 120, 20],
                [550, 160, 80],

                [-480, 340, 15],
                [-250, 300, -6],
                [0, 370, 11],
                [240, 330, -14],
                [480, 350, 18],

                [-780, 0, -60]
            ];

        }

        messages.forEach(function (message, index) {

            const [x, y, rotation] = positions[index];

            message.style.setProperty("--x", `${x}px`);
            message.style.setProperty("--y", `${y}px`);
            message.style.setProperty("--rotation", `${rotation}deg`);

        });

    }, 400);

});

</script>
