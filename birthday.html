<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Room</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>
        body.backb {
            background-image: linear-gradient(rgba(0, 0, 0, 0.50)),
                              url("css/img_2.png");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        .birthday-m {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;

        }

        .birthday-m img {
            height: 700px;
            max-width: 100%;
            width: auto;
            animation: pulse 2s infinite;
            margin-top: 0;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .back-museum {
            position: fixed;
            top: 20px;
            left: 20px;
        }
        .cake-container {
         min-height: 100vh;
         display: flex;
         justify-content: center;
         align-items: center;
        } 
     

    </style>
</head>

<body class="backb">

    

        <a href="museum.html" class="back-museum">
            Back to Museum
        </a>

        <div class="cake-container">

            <div class="birthday-m">
                <a href=https://heyzine.com/flip-book/af84501045.html" target="_blank">
                    <img src="css/Cover.png" alt="Birthday">
                </a>

            </div>
        </div>

</body>

</html>
